<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер штрихкодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Полифилы через unpkg, порядок важен: zbar-wasm → barcode-detector-polyfill → scanner.js -->
    <script defer src="https://unpkg.com/@undecaf/zbar-wasm@0.9.15/dist/index.js"></script>
    <script defer src="https://unpkg.com/@undecaf/barcode-detector-polyfill@0.9.20/dist/index.js"></script>
    <script defer src="scanner.js"></script>

    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 16px;
            text-align: center;
        }
        h2 { margin-top: 0; }
        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            background: #000;
            display: block;
            margin: 0 auto;
        }
        #result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            word-break: break-word;
            min-height: 40px;
        }
        a { color: var(--tg-theme-link-color, #2481cc); }
    </style>
</head>
<body>
    <h2>📷 Сканируйте штрихкод</h2>
    <video id="video" autoplay playsinline muted></video>
    <div id="result">Загрузка...</div>
</body>
</html>
