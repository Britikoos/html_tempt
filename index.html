<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер штрихкодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin: 0;
            padding: 16px;
            text-align: center;
        }
        h2 { margin-top: 0; }

        #preview {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            margin: 12px auto;
            display: none;
        }

        #scanBtn {
            display: block;
            width: 100%;
            max-width: 500px;
            margin: 16px auto;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #scanBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            word-break: break-word;
            min-height: 40px;
        }
        a { color: var(--tg-theme-link-color, #2481cc); }
    </style>
</head>
<body>
    <h2>📷 Сканер штрихкодов</h2>
    <button id="scanBtn">📸 Сделать фото штрихкода</button>
    <img id="preview" alt="Превью">
    <div id="result">Нажмите кнопку, чтобы сделать снимок</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
    <script src="scanner.js"></script>
</body>
</html>
